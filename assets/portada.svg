<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <clipPath id="marco"><rect width="1000" height="260" rx="26"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .o1 { animation: corre 9s linear infinite; }
    .o2 { animation: corre 13s linear infinite reverse; }
    .o3 { animation: corre 7s linear infinite; }
    @keyframes corre { from { transform: translateX(0); } to { transform: translateX(-500px); } }
    @keyframes sube { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-290px); opacity: 0; } }
    .nada { animation: nada 3.2s ease-in-out infinite; }
    @keyframes nada { 0%, 100% { transform: translate(760px, 38px) rotate(-3deg); } 50% { transform: translate(760px, 24px) rotate(3deg); } }
    .bi, .bd { transform-box: fill-box; animation: br 1.6s ease-in-out infinite; }
    .bi { transform-origin: right center; }
    .bd { transform-origin: left center; animation-name: br2; }
    @keyframes br { 50% { transform: rotate(-7deg); } }
    @keyframes br2 { 50% { transform: rotate(7deg); } }
    .aparece { animation: aparece 1.2s ease-out both; }
    .a2 { animation-delay: 0.3s; }
    .a3 { animation-delay: 0.6s; }
    @keyframes aparece { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
