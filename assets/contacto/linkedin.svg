<svg xmlns="http://www.w3.org/2000/svg" width="128" height="140" viewBox="0 -6 128 140">
  <style>
    .salta { animation: salta 2.4s ease-in-out 0.25s infinite; }
    @keyframes salta { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    .aro { animation: aro 2.4s ease-out 0.25s infinite; transform-origin: 64px 64px; }
    @keyframes aro { 0%, 20% { opacity: 0; transform: scale(0.9); } 35% { opacity: 0.8; } 70%, 100% { opacity: 0; transform: scale(1.04); } }
  </style>
  <g class="salta">
    <rect width="128" height="128" rx="28" fill="#242938"/><rect x="26" y="26" width="76" height="76" rx="12" fill="#0A66C2"/><circle cx="45" cy="45" r="7" fill="#fff"/><rect x="38.5" y="57" width="13" height="33" rx="2" fill="#fff"/><path d="M60 57 h12 v5 c3 -4 7 -6 12 -6 c9 0 13 6 13 15 v19 h-13 v-17 c0 -4 -2 -6 -5 -6 c-4 0 -6 3 -6 7 v16 h-13 Z" fill="#fff"/>
    <rect class="aro" x="1" y="1" width="126" height="126" rx="28" fill="none" stroke="#0A66C2" stroke-width="3"/>
  </g>
</svg>
