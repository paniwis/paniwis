<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
  <defs>
    <linearGradient id="mascota-borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="mascota-brillo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mascota-marco"><rect x="2" y="2" width="476" height="196" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .barre { animation: barre 6s ease-in-out infinite; }
    @keyframes barre { 0%, 55% { transform: translateX(-200px); } 100% { transform: translateX(520px); } }
    .flota { animation: flota 3.5s ease-in-out infinite; }
    @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .late { animation: late 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes late { 50% { transform: scale(1.06); } }
  </style>
  <rect x="2" y="2" width="476" height="196" rx="18" fill="#161b22" stroke="url(#mascota-borde)" stroke-width="2"/>
  <g clip-path="url(#mascota-marco)">
    <rect class="barre" x="0" y="0" width="160" height="200" fill="url(#mascota-brillo)"/>
  </g>
  <g class="flota"><svg x="24" y="24" width="80" height="80" viewBox="0 0 96 96">
  <defs><linearGradient id="mascota-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
  <rect width="96" height="96" rx="22" fill="url(#mascota-g)"/>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48 76 C24 60 18 46 24 34 C30 22 44 24 48 34 C52 24 66 22 72 34 C78 46 72 60 48 76 Z"/>
  </g>
</svg></g>
  <text x="124" y="46" fill="#ffffff" font-size="21" font-weight="700">Mascota Virtual</text>
  <text x="124" y="66" fill="#ec4899" font-size="12" font-weight="600" letter-spacing="0.5">JUEGO WEB</text>
  <text x="124" y="92" fill="#c9d1d9" font-size="14">Mascota estilo tamagotchi en el navegador:</text><text x="124" y="112" fill="#c9d1d9" font-size="14">aliméntala, báñala, juega con ella, hazla</text><text x="124" y="132" fill="#c9d1d9" font-size="14">dormir y cuida su ánimo.</text>
  <rect x="24" y="160" width="88" height="24" rx="12" fill="#a855f7" fill-opacity="0.16" stroke="#a855f7" stroke-opacity="0.5"/><text x="68.0" y="176.5" fill="#e6edf3" font-size="12" text-anchor="middle">JavaScript</text><rect x="120" y="160" width="46" height="24" rx="12" fill="#a855f7" fill-opacity="0.16" stroke="#a855f7" stroke-opacity="0.5"/><text x="143.0" y="176.5" fill="#e6edf3" font-size="12" text-anchor="middle">HTML</text><rect x="174" y="160" width="39" height="24" rx="12" fill="#a855f7" fill-opacity="0.16" stroke="#a855f7" stroke-opacity="0.5"/><text x="193.5" y="176.5" fill="#e6edf3" font-size="12" text-anchor="middle">CSS</text>
  
</svg>
