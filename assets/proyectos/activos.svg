<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
  <defs>
    <linearGradient id="activos-borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="activos-brillo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="activos-marco"><rect x="2" y="2" width="476" height="196" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .barre { animation: barre 6s ease-in-out infinite; }
    @keyframes barre { 0%, 55% { transform: translateX(-200px); } 100% { transform: translateX(520px); } }
    .flota { animation: flota 3.5s ease-in-out infinite; }
    @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .late { animation: late 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes late { 50% { transform: scale(1.06); } }
  </style>
  <rect x="2" y="2" width="476" height="196" rx="18" fill="#161b22" stroke="url(#activos-borde)" stroke-width="2"/>
  <g clip-path="url(#activos-marco)">
    <rect class="barre" x="0" y="0" width="160" height="200" fill="url(#activos-brillo)"/>
  </g>
  <g class="flota"><svg x="24" y="24" width="80" height="80" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="activos-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#activos-g)"/>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48 18 L76 32 V64 L48 78 L20 64 V32 Z"/>
      <path d="M20 32 L48 46 L76 32 M48 46 V78"/>
  </g>
</svg></g>
  <text x="124" y="46" fill="#ffffff" font-size="21" font-weight="700">Activos Fijos</text>
  <text x="124" y="66" fill="#06b6d4" font-size="12" font-weight="600" letter-spacing="0.5">PROYECTO ACADÉMICO</text>
  <text x="124" y="92" fill="#c9d1d9" font-size="14">Análisis y arquitectura de un sistema de</text><text x="124" y="112" fill="#c9d1d9" font-size="14">gestión de activos fijos para una institución.</text>
  <rect x="24" y="160" width="102" height="24" rx="12" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-opacity="0.5"/><text x="75.0" y="176.5" fill="#e6edf3" font-size="12" text-anchor="middle">Arquitectura</text><rect x="134" y="160" width="39" height="24" rx="12" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-opacity="0.5"/><text x="153.5" y="176.5" fill="#e6edf3" font-size="12" text-anchor="middle">UML</text>
  
</svg>
